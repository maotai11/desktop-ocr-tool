name: Attach reviewed offline guide
on:
  push:
    branches: ['fix/ocr-selection-ui-20261102']
permissions:
  contents: read
jobs:
  attach_guide:
    if: >-
      github.repository == 'maotai11/desktop-ocr-tool' &&
      github.event.head_commit.message == 'docs-release: v1.8.0-rc.3'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify released binaries and attach the reviewed text guide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          from scripts.build import write_release_readme

          repo = 'maotai11/desktop-ocr-tool'
          tag = 'v1.8.0-rc.3'
          commit = '6a95bd4434174958eb721acfa581ae70034c7b74'
          expected = {
              'InkPick-v1.8.0-rc.3.exe': 'd9684633e55ad6aef80ae399c25a3efd395237620a404f2bc2837119045a6b4e',
              'InkPick-v1.8.0-rc.3.zip': 'acbc5a04b980ddfcceb049dff4a30ee58ce6f1068eebc28cb80335aa924bb1e9',
              'InkPick-v1.8.0-rc.3-SHA256SUMS.txt': '87454dee9793b2ce81d3520667b1cb2b65403415f921cb5d2a3948ce3940cf25',
              'InkPick-v1.8.0-rc.3-validation-metadata.zip': '146e358246f8bdfb72756d3d8b73151e79834306c5fdf71a57291a2c445c7bc4',
          }

          def released():
              raw = subprocess.check_output(['gh', 'api', f'repos/{repo}/releases/tags/{tag}'])
              value = json.loads(raw)
              assert value['draft'] is False and value['target_commitish'] == commit
              assets = {asset['name']: asset for asset in value['assets']}
              for name, digest in expected.items():
                  assert assets[name]['digest'] == 'sha256:' + digest
              return assets

          assets = released()
          guide_name = 'InkPick-v1.8.0-rc.3-README.txt'
          guide_digest = '683c3256a1474aeb454ad8112a2a2e1f94a32c0764edbf29f05ae6fb8e62378c'
          assert set(assets) <= set(expected) | {guide_name}
          directory = Path(os.environ['RUNNER_TEMP']) / 'inkpick-offline-guide'
          directory.mkdir()
          guide = directory / guide_name
          write_release_readme(guide)
          guide.write_text(guide.read_text(encoding='utf-8'), encoding='utf-8-sig', newline='\n')
          assert hashlib.sha256(guide.read_bytes()).hexdigest() == guide_digest
          if guide_name not in assets:
              subprocess.run(['gh', 'release', 'upload', tag, str(guide), '--repo', repo], check=True)
          final = released()
          assert set(final) == set(expected) | {guide_name}
          assert final[guide_name]['digest'] == 'sha256:' + guide_digest
          assert final[guide_name]['size'] == guide.stat().st_size
          print('Reviewed offline guide attached; published asset hashes verified.')
          PY
