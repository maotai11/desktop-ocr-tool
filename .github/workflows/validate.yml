name: Candidate validation (not a clean-machine release gate)
on:
  push:
    branches: [master, 'fix/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      ORT_DISABLE_TELEMETRY: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q --junitxml=test-results.xml
      - run: python src/main.py --self-test source-selftest.json
      - if: runner.os == 'Windows'
        run: python scripts/build.py
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = (Get-ChildItem artifacts/release-*/*.exe | Select-Object -First 1).FullName
          $report = Join-Path $PWD 'frozen-selftest.json'
          $rule = 'DesktopOCR-candidate-test'
          New-NetFirewallRule -DisplayName $rule -Direction Outbound -Program $exe -Action Block -Profile Any | Out-Null
          try {
            $proc = Start-Process -FilePath $exe -ArgumentList @('--self-test', "`"$report`"") -PassThru
            if (-not $proc.WaitForExit(180000)) { Stop-Process -Id $proc.Id; throw 'Frozen self-test timeout' }
            if ($proc.ExitCode -ne 0) { throw "Frozen self-test failed: $($proc.ExitCode)" }
            $result = Get-Content $report -Raw | ConvertFrom-Json
            if (-not $result.passed -or -not $result.frozen) { throw 'Invalid frozen self-test result' }
          } finally {
            Remove-NetFirewallRule -DisplayName $rule
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ runner.os }}
          path: |
            test-results.xml
            *selftest.json
            artifacts/*.zip
            artifacts/*.sha256
          if-no-files-found: warn
