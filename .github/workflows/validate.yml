name: Candidate validation (not a clean-machine release gate)
on:
  push:
    branches: [master, 'fix/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: ${{ matrix.os == 'windows-latest' && 'windows' || 'offscreen' }}
      ORT_DISABLE_TELEMETRY: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        id: checkout
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'
          cache: pip
      - if: runner.os == 'Linux'
        id: linux_dependencies
        run: sudo apt-get update && sudo apt-get install -y libegl1
      # One native command per step: Windows PowerShell must propagate each
      # exit code before a later successful command can replace LASTEXITCODE.
      - name: Resolve wheelhouse
        id: wheels
        run: python -m pip wheel --wheel-dir artifacts/wheelhouse -r requirements-dev.txt
      - name: Record exact input hashes
        id: wheel_inventory
        run: python scripts/record_dependency_inventory.py --wheelhouse artifacts/wheelhouse --report artifacts/dependency-inventory.json
      - name: Install only from recorded local wheels
        id: install
        run: python -m pip install --no-index --find-links artifacts/wheelhouse -r requirements-dev.txt
      - name: Check installed dependencies
        id: dependency_check
        run: python -m pip check
      - name: Record installed dependency inventory
        id: installed_inventory
        run: python scripts/record_dependency_inventory.py --wheelhouse artifacts/wheelhouse --report artifacts/dependency-inventory.json
      - name: Prepare pinned offline OCR models
        id: models
        run: python scripts/prepare_models.py
      - name: Prepare pinned offline handwriting model
        id: handwriting_model
        run: python scripts/prepare_handwriting_model.py
      - name: Build pinned handwriting helper
        id: helper_build
        run: python scripts/build_handwriting_helper.py
      - name: Probe pinned handwriting helper
        id: helper_probe
        run: python scripts/probe_handwriting_helper.py --report artifacts/handwriting-native-probe.json
      - name: Collect and run tests with owned process and memory limits
        id: tests
        run: python scripts/run_bounded_pytest.py --report artifacts/pytest-bounds.json --memory-mib 4096 --timeout 1800 -- -q --junitxml=test-results.xml
      - id: source_selftest
        run: python src/main.py --self-test source-selftest.json
      - id: source_app
        run: python src/main.py --smoke-app source-app-smoke.json
      - id: source_handwriting
        run: python src/main.py --self-test-handwriting source-handwriting.json
      - id: source_image
        run: python src/main.py --self-test-handwriting-image source-handwriting-image.json
      - if: runner.os == 'Windows'
        id: build
        run: python scripts/build.py
      - if: runner.os == 'Windows'
        id: firewall
        shell: pwsh
        run: |
          $bundles = @(Get-ChildItem artifacts/release-* -Directory)
          if ($bundles.Count -ne 1) { throw 'Expected exactly one current release directory' }
          $bundle = $bundles[0].FullName
          $manifest = Get-Content (Join-Path $bundle 'BUILD_MANIFEST.json') -Raw | ConvertFrom-Json
          $exe = Join-Path $bundle $manifest.executable_name
          $rule = 'DesktopOCR-candidate-' + [guid]::NewGuid().ToString()
          New-NetFirewallRule -DisplayName $rule -Direction Outbound -Program $exe -Action Block -Profile Any | Out-Null
          try {
            & ./scripts/validate_windows_bundle.ps1 -BundleDirectory $bundle -ReportDirectory artifacts/firewall-validation
            if ($LASTEXITCODE -ne 0) { throw 'Outbound-blocked frozen candidate gate failed' }
            & ./scripts/validate_handwriting_firewall.ps1 -BundleDirectory $bundle -ReportDirectory artifacts/firewall-validation
            if ($LASTEXITCODE -ne 0) { throw 'Outer/helper outbound-blocked handwriting gate failed' }
            $stressReport = Join-Path $PWD 'artifacts/firewall-validation/frozen-runtime-stress.json'
            $stressProcess = Start-Process -FilePath $exe -ArgumentList @('--stress-ocr', $stressReport) -PassThru
            if (-not $stressProcess.WaitForExit(900000)) { $stressProcess.Kill(); throw 'Frozen stress timed out' }
            if ($stressProcess.ExitCode -ne 0) { throw 'Frozen stress failed' }
            $stress = Get-Content $stressReport -Raw -Encoding UTF8 | ConvertFrom-Json
            if (-not $stress.passed -or $stress.iterations_per_profile -ne 500 -or -not $stress.frozen -or $stress.executable_sha256 -ne $manifest.executable_sha256 -or $stress.version -ne $manifest.version) { throw 'Incomplete frozen stress report' }
            foreach ($profile in @('v6-small', 'v6-medium')) {
              $record = $stress.profiles.$profile
              if (-not $record.passed -or $record.iterations_completed -ne 500 -or $record.identity.profile -ne $profile) { throw ('Incomplete stress profile: ' + $profile) }
            }
          } finally {
            Remove-NetFirewallRule -DisplayName $rule
          }
      - name: Verify actual candidate ZIP and embedded runtime payload
        id: bundle_verify
        if: runner.os == 'Windows'
        run: python scripts/verify_candidate_bundle.py --artifact-root . --expected-commit ${{ github.sha }} --report artifacts/verified-bundle.json --inspect-payload
      - name: Prepare verified public portable files on the Windows runner
        id: public_release
        if: runner.os == 'Windows'
        env:
          INKPICK_PUBLIC_DIR: ${{ runner.temp }}/inkpick-public-release
        run: python scripts/prepare_public_release.py --artifact-root . --output-dir "$env:INKPICK_PUBLIC_DIR"
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows' && success() && steps.public_release.outcome == 'success'
        with:
          name: inkpick-public-candidate-Windows
          path: ${{ runner.temp }}/inkpick-public-release/
          if-no-files-found: error
          retention-days: 7
      # Raw gates, logs, JUnit and original candidate ZIP remain runner-local.
      # Export succeeds only into a fresh allowlisted directory; never upload a
      # stale directory after exporter failure. Portable artifacts are separately
      # selected and verified; private candidate reports are never uploaded.
      - name: Prepare allowlisted public review metadata
        id: public_metadata
        if: always()
        run: python scripts/prepare_public_validation.py --expected-commit ${{ github.sha }} --platform ${{ runner.os }}
        env:
          VALIDATION_STEP_RESULTS: ${{ toJSON(steps) }}
          VALIDATION_JOB_STATUS: ${{ job.status }}
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows' && always() && steps.public_metadata.outcome == 'success'
        with:
          name: validation-metadata-Windows
          path: artifacts/public-validation/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && steps.public_metadata.outcome == 'success'
        with:
          name: validation-${{ runner.os }}
          path: artifacts/public-validation/
          if-no-files-found: error
  publish_prerelease:
    needs: validate
    # One fixed, explicitly approved candidate; never publish from a PR event.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/fix/inkpick-handwriting' &&
      github.repository == 'maotai11/desktop-ocr-tool' &&
      github.event.head_commit.message == 'publish-prerelease: v1.8.0-rc.1'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: validation-Windows
          path: release-input
      - name: Publish only the same-run verified candidate prerelease
        run: python scripts/publish_prerelease.py --artifact-root release-input --verified-bundle release-input/artifacts/verified-bundle.json --output-dir release-upload
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prerelease-publication-evidence
          path: |
            release-upload/*.json
            release-upload/*SHA256SUMS.txt
          if-no-files-found: warn
